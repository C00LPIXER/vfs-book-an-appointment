[project]
name = "vfs-slot-watcher"
version = "0.1.0"
description = "Watches VFS Global (India -> Bulgaria) for open appointment slots and alerts you by Telegram, email and phone call."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
vfsbot = "vfsbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vfsbot*"]
